[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "figtools"
version = "0.1.0"
description = "Portable plotting tools for spallation analysis results"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.setuptools]
packages = ["figtools"]
